# ============================================================
# GitHub Actions Workflow - Daily AI & Technology News Agent
# ============================================================
# Runs every day at 8:30 AM IST (3:00 AM UTC) automatically.
#
# This runs even when your laptop is OFF because GitHub Actions
# executes on GitHub's cloud servers, not on your machine.
#
# SECRETS REQUIRED (set in GitHub repo Settings → Secrets):
#   GEMINI_API_KEY      - Google Gemini API key
#   GMAIL_ADDRESS       - Your Gmail address
#   GMAIL_APP_PASSWORD  - Gmail App Password (16-char code)
#   RECIPIENT_EMAIL     - Where to send the digest
# ============================================================

name: Daily AI News Digest

on:
  # Schedule: 3:00 AM UTC = 8:30 AM IST
  schedule:
    - cron: '0 3 * * *'

  # Allow manual triggering from GitHub UI for testing
  workflow_dispatch:

jobs:
  send-daily-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Daily AI News Agent
        env:
          TEST_MODE: 'false'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python main.py
